name: "New Release Tag"
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  create-release:
    name: "Create Release From Tag"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Create Release Draft"
        uses: softprops/action-gh-release@v2
        with:
          name: Release version ${{ github.ref_name }}
          draft: true
